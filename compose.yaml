services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PGDATABASE:-theater_portfolio}
      POSTGRES_USER: ${PGUSER:-theater_app}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - theater_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  theater_pg:
